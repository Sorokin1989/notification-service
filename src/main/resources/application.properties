spring.application.name=notification-service

server.port=8081

# --- Kafka Consumer ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- Email (Rambler) ---
spring.mail.host=smtp.rambler.ru
spring.mail.port=465
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.mime.charset=UTF-8

spring.mail.properties.mail.smtp.allow8bitmime=true
spring.mail.properties.mail.smtps.allow8bitmime=true


email.message.subject.create-user=Account Created
email.message.text.create-user=Hello! Your account on our website has been successfully created.
email.message.subject.delete-user=Account Deleted
email.message.text.delete-user=Hello! Your account has been deleted.


